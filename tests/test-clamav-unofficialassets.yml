name: Test clamav_unofficialassets input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a target directory with a test file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/scan-target"
          echo "This is a harmless test file." > "$GITHUB_WORKSPACE/scan-target/hello.txt"
      - id: action
        uses: .
        with:
          targets: "${{ github.workspace }}/scan-target"
          clamav_enable: "True"
          clamav_update: "False"
          clamav_unofficialassets: ""
          yara_enable: "False"
          git_integrate: "False"
          summary_found: "None"
          summary_statistics: "None"
      - name: Assert finish output is true
        env:
          FINISH: ${{ steps.action.outputs.finish }}
          FOUND: ${{ steps.action.outputs.found }}
        run: |
          echo "finish: $FINISH"
          echo "found: $FOUND"
          if [ "$FINISH" != "True" ] && [ "$FINISH" != "true" ]; then
            echo "FAIL: expected finish=True but got '$FINISH'"
            exit 1
          fi
          if [ "$FOUND" != "False" ] && [ "$FOUND" != "false" ]; then
            echo "FAIL: expected found=False (no virus in test file) but got '$FOUND'"
            exit 1
          fi
          echo "PASS"
