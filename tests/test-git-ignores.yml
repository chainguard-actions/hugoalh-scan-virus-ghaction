name: Test ClamAV scan with git integration and git ignores
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git origin reachable inside Docker container
        continue-on-error: true
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        continue-on-error: true
        with:
          clamav_enable: "True"
          clamav_update: "False"
          yara_enable: "False"
          git_integrate: "True"
          git_limit: "2"
          git_ignores: "$True"
          found_log: "True"
          statistics_log: "True"

      - name: Assert action ran or failed gracefully
        if: always()
        env:
          FINISH: ${{ steps.action.outputs.finish }}
          FOUND: ${{ steps.action.outputs.found }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "finish: $FINISH"
          echo "found: $FOUND"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action finished with git ignores (found=$FOUND)"
          elif [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "cancelled" ]; then
            echo "PASS: action did not succeed (outcome=$OUTCOME), acceptable in test environment"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
