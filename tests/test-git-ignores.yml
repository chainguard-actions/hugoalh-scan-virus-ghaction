name: Test git_ignores input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Set up a git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"
      - id: action
        uses: .
        with:
          git_integrate: "True"
          git_limit: "1"
          git_ignores: |
            GitCommit: /.+/
          clamav_enable: "True"
          clamav_update: "False"
          yara_enable: "False"
          summary_found: "None"
          summary_statistics: "None"
      - name: Assert finish output is true
        env:
          FINISH: ${{ steps.action.outputs.finish }}
          FOUND: ${{ steps.action.outputs.found }}
        run: |
          echo "finish: $FINISH"
          echo "found: $FOUND"
          if [ "$FINISH" != "True" ] && [ "$FINISH" != "true" ]; then
            echo "FAIL: expected finish=True but got '$FINISH'"
            exit 1
          fi
          echo "PASS"
