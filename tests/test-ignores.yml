name: Test ignores input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create test files
        run: |
          mkdir -p "$GITHUB_WORKSPACE/scan-area"
          echo "Harmless file." > "$GITHUB_WORKSPACE/scan-area/safe.txt"
      - id: action
        uses: .
        with:
          targets: "${{ github.workspace }}/scan-area"
          clamav_enable: "True"
          clamav_update: "False"
          yara_enable: "False"
          git_integrate: "False"
          ignores: |
            Path: scan-area/safe.txt
          summary_found: "None"
          summary_statistics: "None"
      - name: Assert finish output is true
        env:
          FINISH: ${{ steps.action.outputs.finish }}
          FOUND: ${{ steps.action.outputs.found }}
        run: |
          echo "finish: $FINISH"
          echo "found: $FOUND"
          if [ "$FINISH" != "True" ] && [ "$FINISH" != "true" ]; then
            echo "FAIL: expected finish=True but got '$FINISH'"
            exit 1
          fi
          echo "PASS"
