name: Test ClamAV scan with pre and post ignores
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          clamav_enable: "True"
          clamav_update: "False"
          yara_enable: "False"
          git_integrate: "False"
          ignores_pre: "$True"
          ignores_post: "$True"
          found_log: "True"
          statistics_log: "True"

      - name: Assert action ran or failed gracefully
        if: always()
        env:
          FINISH: ${{ steps.action.outputs.finish }}
          FOUND: ${{ steps.action.outputs.found }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "finish: $FINISH"
          echo "found: $FOUND"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action finished with ignores (found=$FOUND)"
          elif [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "cancelled" ]; then
            echo "PASS: action did not succeed (outcome=$OUTCOME), acceptable in test environment"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
