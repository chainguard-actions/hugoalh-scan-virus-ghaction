name: Test ignores input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          ignores: |
            - Path: "**/*.md"
          clamav_enable: "True"
          clamav_update: "False"
          yara_enable: "False"
          log_elements: "All"
          summary_found: "None"
          summary_statistics: "None"
      - name: Assert finish output is true
        env:
          ACTUAL: ${{ steps.action.outputs.finish }}
        run: |
          echo "actual finish: $ACTUAL"
          if [ "$ACTUAL" != "True" ]; then
            echo "FAIL: expected finish='True', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
      - name: Assert found output is set
        env:
          ACTUAL: ${{ steps.action.outputs.found }}
        run: |
          echo "actual found: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected found output to be set"
            exit 1
          fi
          echo "PASS: found=$ACTUAL"
