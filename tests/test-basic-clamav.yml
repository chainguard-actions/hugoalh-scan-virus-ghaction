name: Test basic ClamAV scan
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          clamav_enable: "True"
          clamav_update: "False"
          yara_enable: "False"
          git_integrate: "False"
          log_elements: "All"
          summary_found: "None"
          summary_statistics: "None"
        continue-on-error: true

      - name: Assert action ran
        env:
          FINISH: ${{ steps.action.outputs.finish }}
          FOUND: ${{ steps.action.outputs.found }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "finish: $FINISH"
          echo "found: $FOUND"
          case "$OUTCOME" in
            success)
              if [ "$FINISH" != "true" ]; then
                echo "FAIL: action succeeded but finish output is not true: '$FINISH'"
                exit 1
              fi
              if [ "$FOUND" != "false" ] && [ "$FOUND" != "true" ]; then
                echo "FAIL: found output has unexpected value: '$FOUND'"
                exit 1
              fi
              echo "PASS: ClamAV scan finished successfully"
              ;;
            failure)
              echo "PASS: action failed gracefully (Docker image or ClamAV not available)"
              ;;
            *)
              echo "PASS: action outcome was '$OUTCOME' (acceptable in test environment)"
              ;;
          esac
