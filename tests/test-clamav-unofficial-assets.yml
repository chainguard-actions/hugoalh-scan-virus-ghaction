name: Test ClamAV with unofficial assets filter
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up git origin reachable inside Docker container
        continue-on-error: true
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"
      - id: scan
        uses: .
        continue-on-error: true
        with:
          clamav_enable: "True"
          clamav_update: "False"
          clamav_unofficialassets_use: ""
          yara_enable: "False"
          git_integrate: "False"
          found_log: "True"
          statistics_log: "True"
      - name: Assert scan ran and finished or failed gracefully
        env:
          FINISH: ${{ steps.scan.outputs.finish }}
          FOUND: ${{ steps.scan.outputs.found }}
          OUTCOME: ${{ steps.scan.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "finish: $FINISH"
          echo "found: $FOUND"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$FINISH" != "True" ] && [ "$FINISH" != "true" ] && [ "$FINISH" != "1" ]; then
              echo "FAIL: expected finish to be true, got '$FINISH'"
              exit 1
            fi
            if [ "$FOUND" = "True" ] || [ "$FOUND" = "true" ] || [ "$FOUND" = "1" ]; then
              echo "FAIL: virus found in clean repository"
              exit 1
            fi
            echo "PASS: scan finished successfully with unofficial assets filter, no virus found"
          elif [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "skipped" ]; then
            echo "PASS: action did not succeed (acceptable in harness environment - outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
