name: Test git_ignores and clamav_unofficialassets inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        with:
          git_integrate: "True"
          git_ignores: |
            - Session: ".*"
          git_limit: "1"
          clamav_enable: "True"
          clamav_update: "False"
          clamav_unofficialassets: ""
          yara_enable: "False"
          log_elements: "All"
          summary_found: "None"
          summary_statistics: "None"
      - name: Assert finish output is true
        env:
          ACTUAL: ${{ steps.action.outputs.finish }}
        run: |
          echo "actual finish: $ACTUAL"
          if [ "$ACTUAL" != "True" ]; then
            echo "FAIL: expected finish='True', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
      - name: Assert found output is set
        env:
          ACTUAL: ${{ steps.action.outputs.found }}
        run: |
          echo "actual found: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected found output to be set"
            exit 1
          fi
          echo "PASS: found=$ACTUAL"
