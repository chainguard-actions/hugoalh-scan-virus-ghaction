name: "Scan Virus - Remote"
on:
  workflow_dispatch:
    inputs:
      input_listdelimiter:
        description: "{RegEx} Delimiter when the input is type of list."
        required: false
        default: ",|;|\\r?\\n"
      targets:
        type: "string"
        description: "{Uri[]} Targets."
        required: true
permissions: {}
jobs:
  main:
    name: "Main"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Scan Virus"
        uses: "hugoalh/scan-virus-ghaction/clamav@a2a7748197f9494110c97dbb855d35e7057038a0" # v0.15.0
        with:
          input_listdelimiter: "${{github.event.inputs.input_listdelimiter}}"
          targets: "${{github.event.inputs.targets}}"
          log_elements: "None"
